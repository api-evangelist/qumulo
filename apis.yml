aid: qumulo
name: Qumulo
description: >-
  Qumulo is an enterprise data platform company that delivers a single, unified
  file and object storage system spanning on-premises data centers, the edge,
  and the public cloud (AWS, Azure, GCP) at exabyte scale. Every Qumulo cluster
  exposes a comprehensive versioned REST API (v1/v2/v3+) and the companion `qq`
  command-line tool for programmatic administration of files, snapshots, quotas,
  replication, multi-protocol access (NFS, SMB, S3, FTP), networking, cluster
  operations, monitoring/analytics, and access control. The platform targets
  data-intensive workloads such as AI/ML, high-performance computing, media and
  entertainment, genomics, and enterprise backup, giving organizations a global
  namespace and real-time analytics across their unstructured data.

apis:
- name: Qumulo Core REST API
  description: >-
    The REST API served by every Qumulo cluster for managing files, snapshots,
    quotas, replication, multi-protocol shares (NFS/SMB/S3/FTP), networking,
    cluster lifecycle, monitoring/analytics, and access control. Versioned per
    resource (v1/v2/v3+) with access-token (bearer), session, and SAML auth.
  humanURL: https://docs.qumulo.com/rest-api-guide/
  baseURL: https://{qumulo-cluster}:8000/api
